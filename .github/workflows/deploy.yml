name: Deploy ElinaSmart to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploying via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ -f /root/deploy-elinasmart.sh ]; then
              echo "🚀 Running /root/deploy-elinasmart.sh script..."
              bash /root/deploy-elinasmart.sh
            else
              set -e
              echo "========================================="
              echo "   🚀 Starting Deployment (ElinaSmart)   "
              echo "========================================="
              SITE_DIR="/home/elinasmart.com"

              echo "1️⃣ Pulling latest code from GitHub..."
              cd $SITE_DIR
              git fetch --all
              git reset --hard origin/main

              echo "2️⃣ Updating Backend..."
              cd $SITE_DIR/backend
              npm install
              pm2 restart elina-backend

              echo "3️⃣ Building Frontend..."
              cd $SITE_DIR/frontend
              npm install
              npm run build
              cp -r dist/* $SITE_DIR/public_html/

              echo "4️⃣ Setting CyberPanel User Permissions..."
              chown -R elina6042:elina6042 $SITE_DIR/
              chmod -R 755 $SITE_DIR/public_html

              echo "========================================="
              echo "   ✅ Deployment Completed Successfully!   "
              echo "========================================="
            fi
