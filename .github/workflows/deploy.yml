name: Deploy ElinaSmart to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S bash -c '
            set -e
            echo "Starting deployment on VPS as root ($(whoami))..."
            SITE_DIR="/home/elinasmart.com"

            echo "1. Fetching latest code..."
            cd "$SITE_DIR"
            git config --global --add safe.directory "*" || true
            if [ ! -d ".git" ]; then
              echo "Initializing git repository in $SITE_DIR..."
              git init
              git remote add origin https://github.com/Jawa090/anxora.git || git remote set-url origin https://github.com/Jawa090/anxora.git
            fi
            git fetch --all
            git reset --hard origin/main

            echo "2. Updating backend..."
            cd "$SITE_DIR/backend"
            npm install --production
            pm2 restart elina-backend || pm2 start server.js --name elina-backend

            echo "3. Building frontend..."
            cd "$SITE_DIR/frontend"
            npm install
            npm run build
            rm -rf "$SITE_DIR/public_html/assets"
            cp -r dist/* "$SITE_DIR/public_html/"

            echo "4. Creating production .htaccess for CyberPanel / OpenLiteSpeed..."
            cat << "HTACCESS_EOF" > "$SITE_DIR/public_html/.htaccess"
<IfModule mod_mime.c>
  AddType application/javascript .js .mjs
  AddType text/css .css
</IfModule>

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /
  RewriteRule ^assets/ - [L]
  RewriteRule ^index\.html$ - [L]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule . /index.html [L]
</IfModule>
HTACCESS_EOF

            echo "5. Updating permissions..."
            chown -R elina6042:elina6042 "$SITE_DIR/"
            chmod -R 755 "$SITE_DIR/public_html"

            echo "6. Restarting OpenLiteSpeed to apply .htaccess and MIME rules..."
            systemctl restart lsws 2>/dev/null || /usr/local/lsws/bin/lswsctrl restart 2>/dev/null || true

            echo "Deployment finished successfully!"
            '
