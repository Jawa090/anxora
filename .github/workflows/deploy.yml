name: Production CI/CD Pipeline (ElinaSmart)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Verify Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend Dependencies
        run: |
          echo "Checking backend dependencies..."
          cd backend
          npm ci || npm install

      - name: Build Frontend App
        run: |
          echo "Building frontend application..."
          cd frontend
          npm ci || npm install
          npm run build

  deploy:
    name: Deploy to CyberPanel VPS
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploying via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "========================================="
            echo "   Starting Deployment (ElinaSmart)   "
            echo "========================================="
            SITE_DIR="/home/elinasmart.com"

            echo "1. Pulling latest code from GitHub..."
            cd $SITE_DIR
            git fetch --all
            git reset --hard origin/main

            echo "2. Updating Backend & Restarting PM2..."
            cd $SITE_DIR/backend
            npm install --production
            pm2 restart elina-backend || pm2 start server.js --name elina-backend

            echo "3. Building & Deploying Frontend..."
            cd $SITE_DIR/frontend
            npm install
            npm run build
            rm -rf $SITE_DIR/public_html/assets
            cp -r dist/* $SITE_DIR/public_html/

            echo "4. Generating Production .htaccess for OpenLiteSpeed..."
            cat << 'EOF' > $SITE_DIR/public_html/.htaccess
# Force correct MIME types for JS & CSS
<IfModule mod_mime.c>
  AddType application/javascript .js .mjs
  AddType text/css .css
</IfModule>

# SPA Routing for OpenLiteSpeed / CyberPanel
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /

  # Do not rewrite static asset files
  RewriteCond %{REQUEST_URI} ^/assets/ [NC]
  RewriteRule ^ - [L]

  RewriteRule ^index\.html$ - [L]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule . /index.html [L]
</IfModule>
EOF

            echo "5. Fixing CyberPanel User Permissions..."
            chown -R elina6042:elina6042 $SITE_DIR/
            chmod -R 755 $SITE_DIR/public_html

            echo "========================================="
            echo "   Deployment Completed Successfully!   "
            echo "========================================="
